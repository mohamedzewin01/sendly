name: sendly
description: "مساعد ذكي لإدارة جهات الاتصال والرسائل مع إمكانية الإرسال السريع"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.1.0+12



environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  package_info_plus: ^8.3.0
  google_mobile_ads: ^9.1.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1130A7"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  # أدوات توليد فقط (لا تدخل التطبيق)
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4


flutter:


  uses-material-design: true

  assets:
    - assets/images/

  # خط IBM Plex Sans Arabic (ترخيص SIL OFL 1.1 — انظر assets/fonts/OFL.txt)
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
