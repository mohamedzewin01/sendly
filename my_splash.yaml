# إعدادات شاشة البداية (Splash). للتوليد:
#   dart run flutter_native_splash:create --path=my_splash.yaml
flutter_native_splash:
  # الوضع الفاتح
  color: "#F5F7FD"
  image: assets/branding/splash_logo.png
  branding: assets/branding/branding_mark_dark.png

  # الوضع الداكن
  color_dark: "#0A1024"
  image_dark: assets/branding/splash_logo.png
  branding_dark: assets/branding/branding_mark.png

  branding_mode: bottom
  branding_bottom_padding: 40

  # أندرويد 12 وما بعده (أيقونة داخل دائرة)
  android_12:
    image: assets/branding/logo12.png
    color: "#F5F7FD"
    icon_background_color: "#1130A7"
    image_dark: assets/branding/logo12.png
    color_dark: "#0A1024"
    icon_background_color_dark: "#1130A7"

  # التطبيق للموبايل فقط
  web: false
